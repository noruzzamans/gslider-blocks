name: Deploy to WordPress.org & GitHub Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate SVN deployment in dry-run mode (zero commit to SVN)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: deploy-${{ github.ref_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Build, Verify & Deploy Plugin
    runs-on: ubuntu-latest
    env:
      HAS_SVN_CREDENTIALS: ${{ secrets.SVN_PASSWORD != '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run PHP Unit Tests
        run: composer test

      - name: Verify MCP Schema Drift
        run: npm run mcp:test

      - name: Build Gutenberg Blocks
        run: npm run build:production

      - name: Build Admin Assets
        run: npm run admin:build

      - name: Generate Distributable Plugin ZIP
        run: npm run zip

      - name: Attach Plugin ZIP to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gslider-blocks.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to WordPress.org SVN
        if: env.HAS_SVN_CREDENTIALS == 'true' && (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.dry_run == 'true')
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: ${{ github.event.inputs.dry_run || 'false' }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: 'gslider-blocks'
          ASSETS_DIR: '.wordpress-org'
