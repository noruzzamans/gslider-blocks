name: "💡 Feature Request"
description: "Suggest an idea or enhancement for GSlider Blocks"
title: "feat: "
labels: ["type: enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make **GSlider Blocks** even better? Tell us what you'd love to see!

  - type: textarea
    id: problem
    attributes:
      label: "Is your feature request related to a problem?"
      description: "A clear and concise description of what the problem is."
      placeholder: "I'm always frustrated when..."
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: "Describe the Solution You'd Like"
      description: "A clear description of what you want to happen."
      placeholder: "Add support for vertical thumbnail navigation..."
    validations:
      required: true

  - type: dropdown
    id: target_area
    attributes:
      label: "Target Area"
      options:
        - "Gutenberg Block Feature"
        - "Design System Control"
        - "Headless WP / REST API"
        - "MCP AI Tools"
        - "Performance / Swiper Engine"
    validations:
      required: true
